<!doctype html>
<html lang="pl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2166f3"><link rel="manifest" href="manifest.json">
<title>NovaPOS</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}
button,input,select{font:inherit}button{border:0;cursor:pointer}.hidden{display:none!important}
header{height:70px;background:#fff;border-bottom:1px solid #e3e6ea;display:flex;align-items:center;padding:0 20px;gap:14px}.logo{font-size:23px;font-weight:800}.logo b{color:#2166f3}.status{font-size:12px;color:#16875b;background:#e8f7f0;padding:7px 10px;border-radius:20px}.grow{flex:1}
.app{display:grid;grid-template-columns:210px 1fr 370px;height:calc(100vh - 70px)}aside{background:#fff;border-right:1px solid #e3e6ea;padding:15px}.nav{display:block;width:100%;text-align:left;background:transparent;padding:13px;border-radius:12px;margin:3px 0;color:#53606d}.nav.active{background:#eaf1ff;color:#2166f3;font-weight:700}
main{padding:22px;overflow:auto}.topline{display:flex;justify-content:space-between;align-items:end;margin-bottom:17px}.topline h1{margin:0}.sub{color:#77818c;font-size:14px;margin-top:4px}.search{padding:12px;border:1px solid #ddd;border-radius:12px;background:#fff;width:280px}
.cats{display:flex;gap:8px;margin-bottom:15px;overflow:auto}.cat{padding:9px 14px;background:#fff;border:1px solid #ddd;border-radius:20px;white-space:nowrap}.cat.on{background:#17202a;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.prod{background:#fff;border:1px solid #e1e5e9;border-radius:16px;padding:14px;text-align:left;min-height:135px}.emoji{font-size:30px}.pn{font-weight:700;margin-top:12px}.pp{font-weight:800;margin-top:5px}.tag{font-size:11px;color:#77818c}
.cart{background:#fff;border-left:1px solid #e3e6ea;display:flex;flex-direction:column}.cart h3{padding:18px;margin:0;border-bottom:1px solid #eee}.items{flex:1;overflow:auto;padding:10px 15px}.item{display:flex;justify-content:space-between;padding:13px 4px;border-bottom:1px solid #eee}.iname{font-weight:700}.qty{margin-top:7px;display:flex;gap:7px;align-items:center}.q{width:28px;height:28px;border-radius:8px;background:#edf0f4}.summary{padding:16px;border-top:1px solid #eee}.row{display:flex;justify-content:space-between;margin:8px 0;color:#5d6874}.total{font-size:23px;font-weight:800;color:#17202a;margin:14px 0}.pay{width:100%;background:#2166f3;color:white;padding:15px;border-radius:13px;font-weight:800}.logout{width:100%;padding:11px;background:#f0f2f5;border-radius:12px;margin-top:8px}
.login{position:fixed;inset:0;background:#eef1f5;display:flex;align-items:center;justify-content:center;padding:20px}.loginbox{background:#fff;width:min(430px,100%);padding:28px;border-radius:25px;box-shadow:0 18px 60px #0002;text-align:center}.pin{font-size:30px;letter-spacing:12px;text-align:center;width:100%;padding:14px;border:1px solid #ddd;border-radius:15px}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:15px}.keypad button{padding:18px;background:#f0f2f5;border-radius:13px;font-weight:700}.err{color:#d33;margin-top:10px;min-height:20px}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:20px}.box{background:#fff;border-radius:22px;padding:24px;width:min(560px,100%)}.paygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.payopt{padding:22px;background:#f0f2f5;border-radius:14px;font-weight:700}
@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}.app{grid-template-columns:170px 1fr 330px}}
@media(max-width:800px){header{height:62px}.app{height:calc(100vh - 62px);display:block}.side{display:none}.cart{position:fixed;right:0;top:62px;bottom:0;width:min(380px,95vw);transform:translateX(100%);transition:.2s;z-index:5}.cart.open{transform:none}.grid{grid-template-columns:repeat(2,1fr)}main{padding:15px}.search{width:190px}}
</style></head><body>
<div id="login" class="login"><div class="loginbox">
<div class="logo">Nova<b>POS</b></div><h2>Logowanie pracownika</h2><div class="sub">Wpisz 4-cyfrowy PIN</div>
<input id="pin" class="pin" type="password" inputmode="numeric" maxlength="4" readonly>
<div class="keypad">
<button onclick="key('1')">1</button><button onclick="key('2')">2</button><button onclick="key('3')">3</button>
<button onclick="key('4')">4</button><button onclick="key('5')">5</button><button onclick="key('6')">6</button>
<button onclick="key('7')">7</button><button onclick="key('8')">8</button><button onclick="key('9')">9</button>
<button onclick="key('C')">⌫</button><button onclick="key('0')">0</button><button onclick="login()">✓</button></div>
<div id="err" class="err"></div><div class="sub">Testowe PIN-y: Kasjer 1234 · Kierownik 2468 · Administrator 9999</div>
</div></div>
<header><div class="logo">Nova<b>POS</b></div><div class="status">● Offline</div><div class="grow"></div><span id="who"></span><select id="mode"><option>Restauracja</option><option>Kawiarnia</option><option>Sklep</option></select></header>
<div class="app"><aside class="side" id="side"></aside><main><div class="topline"><div><h1>Sprzedaż</h1><div class="sub">Tryb offline · dane zapisują się na iPadzie</div></div><input id="search" class="search" placeholder="Szukaj produktu"></div><div id="cats" class="cats"></div><div id="products" class="grid"></div></main>
<section class="cart" id="cart"><h3>🧾 Bieżące zamówienie</h3><div id="items" class="items"></div><div class="summary"><div class="row"><span>Netto</span><b id="net">0,00 zł</b></div><div class="row"><span>VAT</span><b id="vat">0,00 zł</b></div><div class="row total"><span>Razem</span><b id="total">0,00 zł</b></div><button class="pay" onclick="pay()">💳 Zapłać</button><button class="logout" onclick="logout()">Wyloguj pracownika</button></div></section></div>
<div id="modal" class="modal hidden"><div class="box"><h2>Wybierz płatność</h2><div class="paygrid"><button class="payopt" onclick="finish('Karta')">💳<br>Karta</button><button class="payopt" onclick="finish('Gotówka')">💵<br>Gotówka</button><button class="payopt" onclick="finish('BLIK')">📱<br>BLIK</button></div><button class="logout" onclick="closeModal()">Anuluj</button></div></div>
<script>
const products=[["Espresso",8,"☕","Kawa"],["Cappuccino",14,"☕","Kawa"],["Latte",15,"🥛","Kawa"],["Herbata",10,"🍵","Napoje"],["Lemoniada",13,"🍋","Napoje"],["Croissant",11,"🥐","Jedzenie"],["Sernik",18,"🍰","Desery"],["Tost",19,"🥪","Jedzenie"],["Burger",32,"🍔","Dania"],["Sałatka",27,"🥗","Dania"],["Pizza",34,"🍕","Dania"],["Woda",7,"💧","Napoje"]];
const roles={Kasjer:["Sprzedaż","Zamówienia"],Kierownik:["Sprzedaż","Zamówienia","Produkty","Magazyn","Raporty"],Administrator:["Sprzedaż","Zamówienia","Produkty","Magazyn","Pracownicy","Raporty","Ustawienia"]};
const users={1234:["Jan Kowalski","Kasjer"],2468:["Anna Nowak","Kierownik"],9999:["Administrator","Administrator"]};
let current=null,cart=[],cat="Wszystkie";
const money=x=>x.toFixed(2).replace(".",",")+" zł";
function key(k){let p=document.getElementById("pin");if(k==="C")p.value=p.value.slice(0,-1);else if(p.value.length<4)p.value+=k}
function login(){let u=users[document.getElementById("pin").value];if(!u){document.getElementById("err").textContent="Nieprawidłowy PIN";return}current={name:u[0],role:u[1]};sessionStorage.setItem("novapos-user",JSON.stringify(current));document.getElementById("login").classList.add("hidden");document.getElementById("who").textContent=current.name+" · "+current.role;renderNav();render()}
function logout(){current=null;cart=[];sessionStorage.removeItem("novapos-user");document.getElementById("pin").value="";document.getElementById("login").classList.remove("hidden")}
function renderNav(){let items=roles[current.role];document.getElementById("side").innerHTML=items.map((x,i)=>`<button class="nav ${i===0?"active":""}" onclick="module('${x}')">${({Sprzedaż:"🛒",Zamówienia:"🧾",Produkty:"📦",Magazyn:"🏷️",Pracownicy:"👥",Raporty:"📊",Ustawienia:"⚙️"})[x]} ${x}</button>`).join("")}
function module(x){if(x==="Sprzedaż"){document.querySelector("main h1").textContent="Sprzedaż";render()}else alert(x+" — moduł dostępny w wersji produkcyjnej.");}
function render(){let q=document.getElementById("search").value.toLowerCase();let cats=["Wszystkie",...new Set(products.map(p=>p[3]))];document.getElementById("cats").innerHTML=cats.map(c=>`<button class="cat ${c===cat?"on":""}" onclick="cat='${c}';render()">${c}</button>`).join("");document.getElementById("products").innerHTML=products.filter(p=>(cat==="Wszystkie"||p[3]===cat)&&p[0].toLowerCase().includes(q)).map((p,i)=>`<button class="prod" onclick="add(${i})"><div class="emoji">${p[2]}</div><div class="pn">${p[0]}</div><div class="pp">${money(p[1])}</div><div class="tag">${p[3]}</div></button>`).join("");let e=document.getElementById("items");e.innerHTML=cart.length?cart.map((x,i)=>`<div class="item"><div><div class="iname">${x.name}</div><div class="qty"><button class="q" onclick="chg(${i},-1)">−</button><b>${x.qty}</b><button class="q" onclick="chg(${i},1)">+</button></div></div><b>${money(x.price*x.qty)}</b></div>`).join(""):"<div class='sub' style='padding:40px 10px;text-align:center'>Koszyk jest pusty</div>";let gross=cart.reduce((s,x)=>s+x.price*x.qty,0),net=gross/1.23;document.getElementById("net").textContent=money(net);document.getElementById("vat").textContent=money(gross-net);document.getElementById("total").textContent=money(gross)}
function add(i){let p=products[i],x=cart.find(x=>x.name===p[0]);x?x.qty++:cart.push({name:p[0],price:p[1],qty:1});render()}function chg(i,n){cart[i].qty+=n;if(cart[i].qty<1)cart.splice(i,1);render()}function pay(){if(cart.length)document.getElementById("modal").classList.remove("hidden")}function closeModal(){document.getElementById("modal").classList.add("hidden")}function finish(m){alert("Płatność "+m+" zakończona.\nPracownik: "+current.name);cart=[];closeModal();render()}
document.getElementById("search").oninput=render;let saved=sessionStorage.getItem("novapos-user");if(saved){current=JSON.parse(saved);document.getElementById("login").classList.add("hidden");document.getElementById("who").textContent=current.name+" · "+current.role;renderNav();render()}
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
