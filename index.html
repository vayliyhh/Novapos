<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1769e0">
<link rel="manifest" href="manifest.json">
<title>NovaPOS 2.0</title>
<style>
:root{--blue:#1769e0;--bg:#f4f6f8;--card:#fff;--ink:#17202a;--muted:#71808e;--line:#e3e8ed;--green:#169b67;--red:#d94150;--orange:#e58b22;--shadow:0 8px 28px #1422350d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}.hidden{display:none!important}
.header{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:14px;position:sticky;top:0;z-index:20}.logo{font-size:23px;font-weight:850}.logo b{color:var(--blue)}.pill{padding:7px 10px;border-radius:20px;background:#e9f8f1;color:var(--green);font-size:12px;font-weight:700}.grow{flex:1}.user{font-size:13px;color:var(--muted)}.select,.topbtn{background:#f1f4f7;padding:10px 12px;border-radius:11px;border:1px solid transparent}
.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 68px)}.side{background:#fff;border-right:1px solid var(--line);padding:14px;position:sticky;top:68px;height:calc(100vh - 68px);overflow:auto}.nav{width:100%;background:transparent;text-align:left;padding:12px;border-radius:12px;margin:2px 0;color:#566371}.nav.active{background:#eaf1ff;color:var(--blue);font-weight:750}.nav.section{font-size:11px;text-transform:uppercase;color:#9aa4ad;margin-top:15px;padding-bottom:5px}
.content{padding:22px;max-width:1450px;width:100%;margin:auto}.titlebar{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:18px}.titlebar h1{margin:0;font-size:28px}.muted{color:var(--muted);font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:10px 14px;border-radius:11px;background:#eef2f6}.btn.primary{background:var(--blue);color:#fff;font-weight:750}.btn.green{background:#e8f8f0;color:var(--green);font-weight:700}.btn.danger{background:#fdebed;color:var(--red)}.btn.small{padding:7px 10px;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:18px}.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:var(--shadow)}.stat .label{font-size:13px;color:var(--muted)}.stat .value{font-size:25px;font-weight:850;margin-top:8px}.stat .hint{font-size:12px;color:var(--green);margin-top:4px}
.panel{background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow);overflow:hidden}.panelhead{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.panelbody{padding:16px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.search{padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;min-width:220px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 10px;border-bottom:1px solid #edf0f3;text-align:left;font-size:14px}.table th{font-size:12px;text-transform:uppercase;color:#8a949e}.badge{display:inline-block;padding:5px 8px;border-radius:9px;background:#eef2f6;font-size:12px}.badge.green{background:#e8f8f0;color:var(--green)}.badge.red{background:#fdebed;color:var(--red)}.badge.orange{background:#fff3df;color:#a86716}
.sales{display:grid;grid-template-columns:1fr 390px;gap:16px}.categories{display:flex;gap:8px;overflow:auto;margin-bottom:13px}.cat{padding:9px 14px;border-radius:20px;background:#fff;border:1px solid var(--line);white-space:nowrap}.cat.active{background:var(--ink);color:#fff}.products{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.product{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;min-height:145px;box-shadow:var(--shadow)}.product:hover{border-color:#9eb8e8}.emoji{font-size:31px}.pname{font-weight:750;margin-top:12px}.price{font-weight:850;margin-top:5px}.stock{font-size:11px;color:var(--muted);margin-top:4px}
.cart{background:#fff;border:1px solid var(--line);border-radius:17px;display:flex;flex-direction:column;max-height:calc(100vh - 110px);position:sticky;top:90px}.carthead{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.cartitems{padding:8px 14px;overflow:auto;flex:1}.cartitem{padding:12px 3px;border-bottom:1px solid #edf0f3;display:flex;justify-content:space-between;gap:8px}.qty{display:flex;gap:6px;align-items:center;margin-top:7px}.q{width:27px;height:27px;border-radius:8px;background:#edf1f5}.summary{padding:15px;border-top:1px solid var(--line)}.row{display:flex;justify-content:space-between;margin:7px 0;color:#596572}.total{font-size:24px;font-weight:850;color:var(--ink);margin:13px 0}.pay{width:100%;padding:15px;background:var(--blue);color:#fff;border-radius:12px;font-weight:800;font-size:16px}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:var(--muted);font-weight:650}.field input,.field select,.field textarea{padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}.field textarea{min-height:90px}.full{grid-column:1/-1}
.modal{position:fixed;inset:0;background:#0007;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}.modalbox{background:#fff;border-radius:22px;padding:22px;width:min(680px,100%);max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{background:#eef1f4;padding:8px 11px;border-radius:10px}.paygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.payopt{padding:22px;background:#f0f3f6;border-radius:14px;font-weight:750}
.login{position:fixed;inset:0;background:#eef2f6;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}.loginbox{width:min(430px,100%);background:#fff;border-radius:25px;padding:28px;box-shadow:0 20px 70px #0002;text-align:center}.pin{width:100%;font-size:30px;text-align:center;letter-spacing:12px;padding:13px;border:1px solid var(--line);border-radius:14px}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.keypad button{padding:17px;border-radius:12px;background:#eef1f4;font-weight:750}.error{height:22px;color:var(--red);font-size:13px;margin-top:7px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#17202a;color:#fff;padding:12px 16px;border-radius:12px;z-index:200;box-shadow:var(--shadow)}
.empty{text-align:center;padding:35px;color:var(--muted)}.dangertext{color:var(--red)}
@media(max-width:1100px){.cards{grid-template-columns:repeat(2,1fr)}.products{grid-template-columns:repeat(3,1fr)}.sales{grid-template-columns:1fr 350px}.grid4{grid-template-columns:repeat(2,1fr)}} 
@media(max-width:800px){.layout{display:block}.side{position:fixed;left:0;top:68px;bottom:0;width:220px;transform:translateX(-100%);z-index:30;transition:.2s}.side.open{transform:none}.content{padding:14px}.sales{display:block}.cart{position:fixed;right:0;top:68px;bottom:0;width:min(390px,94vw);z-index:25;transform:translateX(100%);transition:.2s}.cart.open{transform:none}.products{grid-template-columns:repeat(2,1fr)}.grid3,.formgrid{grid-template-columns:1fr}.titlebar{align-items:start;flex-direction:column}.cards{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="login" class="login"><div class="loginbox">
<div class="logo">Nova<b>POS</b></div><h2>Logowanie pracownika</h2><div class="muted">Wprowadź 4-cyfrowy PIN</div>
<input id="pin" class="pin" type="password" inputmode="numeric" maxlength="4" readonly>
<div class="keypad">
<button onclick="pinKey('1')">1</button><button onclick="pinKey('2')">2</button><button onclick="pinKey('3')">3</button>
<button onclick="pinKey('4')">4</button><button onclick="pinKey('5')">5</button><button onclick="pinKey('6')">6</button>
<button onclick="pinKey('7')">7</button><button onclick="pinKey('8')">8</button><button onclick="pinKey('9')">9</button>
<button onclick="pinKey('C')">⌫</button><button onclick="pinKey('0')">0</button><button onclick="doLogin()">✓</button>
</div><div id="loginError" class="error"></div><div class="muted">Testowe: Kasjer 1234 · Kierownik 2468 · Administrator 9999</div>
</div></div>

<header class="header"><button class="topbtn" onclick="toggleSide()">☰</button><div class="logo">Nova<b>POS</b></div><span class="pill">● OFFLINE</span><span id="syncState" class="muted"></span><div class="grow"></div><span id="who" class="user"></span><select id="business" class="select" onchange="saveSettings()"><option>Restauracja</option><option>Kawiarnia</option><option>Sklep</option></select></header>
<div class="layout"><aside class="side" id="side"></aside><main class="content" id="content"></main></div>
<div id="modal" class="modal hidden"></div><div id="toast" class="toast hidden"></div>
<script>
const KEY='novapos-v2';
const defaultData={
products:[
{id:1,name:'Espresso',price:8,vat:23,stock:50,cat:'Kawa',emoji:'☕',active:true},
{id:2,name:'Cappuccino',price:14,vat:23,stock:45,cat:'Kawa',emoji:'☕',active:true},
{id:3,name:'Latte',price:15,vat:23,stock:40,cat:'Kawa',emoji:'🥛',active:true},
{id:4,name:'Herbata',price:10,vat:23,stock:30,cat:'Napoje',emoji:'🍵',active:true},
{id:5,name:'Lemoniada',price:13,vat:23,stock:25,cat:'Napoje',emoji:'🍋',active:true},
{id:6,name:'Croissant',price:11,vat:23,stock:20,cat:'Jedzenie',emoji:'🥐',active:true},
{id:7,name:'Sernik',price:18,vat:23,stock:12,cat:'Desery',emoji:'🍰',active:true},
{id:8,name:'Tost',price:19,vat:23,stock:18,cat:'Jedzenie',emoji:'🥪',active:true},
{id:9,name:'Burger',price:32,vat:23,stock:14,cat:'Dania',emoji:'🍔',active:true},
{id:10,name:'Sałatka',price:27,vat:23,stock:10,cat:'Dania',emoji:'🥗',active:true},
{id:11,name:'Pizza',price:34,vat:23,stock:16,cat:'Dania',emoji:'🍕',active:true},
{id:12,name:'Woda',price:7,vat:23,stock:60,cat:'Napoje',emoji:'💧',active:true}],
employees:[
{id:1,name:'Jan Kowalski',role:'Kasjer',pin:'1234',active:true},
{id:2,name:'Anna Nowak',role:'Kierownik',pin:'2468',active:true},
{id:3,name:'Administrator',role:'Administrator',pin:'9999',active:true}],
sales:[],orders:[],expenses:[],customers:[],stockMoves:[],tables:Array.from({length:12},(_,i)=>({id:i+1,status:'Wolny',order:null})),
settings:{business:'Restauracja',tax:23,currency:'PLN',receiptFooter:'Dziękujemy za wizytę!'},
next:{product:13,employee:4,sale:1,order:1,expense:1,customer:1,stock:1}
};
let db=JSON.parse(localStorage.getItem(KEY)||'null')||defaultData;
let current=null, cart=[], activeCat='Wszystkie', page='dashboard';
const perms={Kasjer:['dashboard','sales','orders'],Kierownik:['dashboard','sales','orders','products','inventory','reports','tables','customers','expenses'],Administrator:['dashboard','sales','orders','products','inventory','reports','tables','customers','expenses','employees','settings','backup']};
const labels={dashboard:['🏠','Pulpit'],sales:['🛒','Sprzedaż'],orders:['🧾','Zamówienia'],products:['📦','Produkty'],inventory:['🏷️','Magazyn'],tables:['🪑','Stoliki'],customers:['👥','Klienci'],expenses:['💸','Wydatki'],reports:['📊','Raporty'],employees:['🧑‍💼','Pracownicy'],settings:['⚙️','Ustawienia'],backup:['💾','Kopia danych']};
const money=v=>(Number(v)||0).toFixed(2).replace('.',',')+' zł';
function persist(){localStorage.setItem(KEY,JSON.stringify(db));document.getElementById('syncState').textContent='· zapisane lokalnie'}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2200)}
function pinKey(k){let p=document.getElementById('pin');if(k==='C')p.value=p.value.slice(0,-1);else if(p.value.length<4)p.value+=k}
function doLogin(){let p=document.getElementById('pin').value,u=db.employees.find(x=>x.pin===p&&x.active);if(!u){document.getElementById('loginError').textContent='Nieprawidłowy PIN';return}current=u;sessionStorage.setItem('novapos-current',JSON.stringify(u));document.getElementById('login').classList.add('hidden');document.getElementById('who').textContent=u.name+' · '+u.role;document.getElementById('business').value=db.settings.business;renderNav();go('dashboard')}
function logout(){current=null;cart=[];sessionStorage.removeItem('novapos-current');document.getElementById('pin').value='';document.getElementById('loginError').textContent='';document.getElementById('login').classList.remove('hidden')}
function renderNav(){let allowed=perms[current.role];document.getElementById('side').innerHTML='<div class="nav section">Główne</div>'+allowed.map(k=>`<button class="nav ${page===k?'active':''}" onclick="go('${k}')">${labels[k][0]} ${labels[k][1]}</button>`).join('')}
function go(p){if(!perms[current.role].includes(p)){toast('Brak uprawnień dla tej roli');return}page=p;renderNav();renderPage();document.getElementById('side').classList.remove('open')}
function toggleSide(){document.getElementById('side').classList.toggle('open')}
function saveSettings(){db.settings.business=document.getElementById('business').value;persist();toast('Ustawienia zapisane')}
function renderPage(){let c=document.getElementById('content');({dashboard:dashboard,sales:sales,orders:orders,products:productsPage,inventory:inventory,tables:tables,customers:customers,expenses:expenses,reports:reports,employees:employees,settings:settings,backup:backup}[page])()}
function title(t,s,actions=''){document.getElementById('content').innerHTML=`<div class="titlebar"><div><h1>${t}</h1><div class="muted">${s}</div></div><div class="actions">${actions}</div></div>`}
function dashboard(){let today=new Date().toISOString().slice(0,10),ss=db.sales.filter(s=>s.date.slice(0,10)===today),rev=ss.reduce((a,s)=>a+s.total,0),low=db.products.filter(p=>p.stock<=5&&p.active).length;title('Pulpit','Najważniejsze informacje ze sprzedaży','<button class="btn primary" onclick="go(\\'sales\\')">+ Nowa sprzedaż</button>');document.getElementById('content').innerHTML+=`<div class="cards"><div class="stat"><div class="label">Sprzedaż dzisiaj</div><div class="value">${money(rev)}</div><div class="hint">${ss.length} transakcji</div></div><div class="stat"><div class="label">Średni paragon</div><div class="value">${money(ss.length?rev/ss.length:0)}</div></div><div class="stat"><div class="label">Niski stan</div><div class="value">${low}</div><div class="hint ${low?'dangertext':''}">${low?'Wymaga uzupełnienia':'Magazyn OK'}</div></div><div class="stat"><div class="label">Otwarte zamówienia</div><div class="value">${db.orders.filter(o=>o.status!=='Zamknięte').length}</div></div></div><div class="grid3"><div class="panel"><div class="panelhead"><b>Ostatnie transakcje</b></div><div class="panelbody">${ss.slice(-6).reverse().map(s=>`<div class="row"><span>#${s.id} · ${s.payment}</span><b>${money(s.total)}</b></div>`).join('')||'<div class="empty">Brak sprzedaży dzisiaj</div>'}</div></div><div class="panel"><div class="panelhead"><b>Alerty magazynowe</b></div><div class="panelbody">${db.products.filter(p=>p.stock<=5&&p.active).map(p=>`<div class="row"><span>${p.emoji} ${p.name}</span><span class="badge red">${p.stock} szt.</span></div>`).join('')||'<div class="empty">Brak alertów</div>'}</div></div><div class="panel"><div class="panelhead"><b>Szybkie akcje</b></div><div class="panelbody"><button class="btn primary" onclick="go('products')">Dodaj produkt</button> <button class="btn" onclick="go('inventory')">Przyjęcie dostawy</button><br><br><button class="btn" onclick="go('reports')">Raport dnia</button></div></div></div>`}
function sales(){let cats=['Wszystkie',...new Set(db.products.filter(p=>p.active).map(p=>p.cat))];title('Sprzedaż','Dodawaj produkty do bieżącego koszyka','<button class="btn" onclick="openCart()">🛒 Koszyk</button>');document.getElementById('content').innerHTML+=`<div class="sales"><div><div style="display:flex;gap:8px;margin-bottom:12px"><input id="psearch" class="search" placeholder="Szukaj produktu..." oninput="renderProducts()"></div><div id="cats" class="categories">${cats.map(x=>`<button class="cat ${x===activeCat?'active':''}" onclick="activeCat='${x}';sales()">${x}</button>`).join('')}</div><div id="productGrid" class="products"></div></div><div id="cartPanel"></div></div>`;renderProducts()}
function renderProducts(){let q=(document.getElementById('psearch')?.value||'').toLowerCase(),ps=db.products.filter(p=>p.active&&(activeCat==='Wszystkie'||p.cat===activeCat)&&p.name.toLowerCase().includes(q));document.getElementById('productGrid').innerHTML=ps.map(p=>`<button class="product" onclick="addCart(${p.id})"><div class="emoji">${p.emoji}</div><div class="pname">${p.name}</div><div class="price">${money(p.price)}</div><div class="stock">Stan: ${p.stock}</div></button>`).join('')}
function cartHTML(){let gross=cart.reduce((a,x)=>a+x.price*x.qty,0),net=gross/1.23,vat=gross-net;return `<div class="cart" id="cartBox"><div class="carthead"><b>🧾 Koszyk</b><button class="btn small" onclick="cart=[];renderCart()">Wyczyść</button></div><div class="cartitems">${cart.map((x,i)=>`<div class="cartitem"><div><b>${x.name}</b><div class="qty"><button class="q" onclick="chg(${i},-1)">−</button><b>${x.qty}</b><button class="q" onclick="chg(${i},1)">+</button></div></div><b>${money(x.price*x.qty)}</b></div>`).join('')||'<div class="empty">Koszyk pusty</div>'}</div><div class="summary"><div class="row"><span>Netto</span><b>${money(net)}</b></div><div class="row"><span>VAT</span><b>${money(vat)}</b></div><div class="row total"><span>Razem</span><b>${money(gross)}</b></div><button class="pay" onclick="payModal()">💳 Zapłać</button></div></div>`}
function renderCart(){let e=document.getElementById('cartPanel');if(e)e.innerHTML=cartHTML()}
function addCart(id){let p=db.products.find(x=>x.id===id),x=cart.find(x=>x.id===id);if(!p||p.stock<=0)return toast('Brak produktu na magazynie');x?x.qty++:cart.push({id:p.id,name:p.name,price:p.price,qty:1});renderCart()}
function chg(i,n){cart[i].qty+=n;if(cart[i].qty<=0)cart.splice(i,1);renderCart()}
function openCart(){document.getElementById('cartPanel')?.scrollIntoView({behavior:'smooth'})}
function payModal(){if(!cart.length)return toast('Koszyk jest pusty');document.getElementById('modal').classList.remove('hidden');document.getElementById('modal').innerHTML=`<div class="modalbox"><div class="modalhead"><h2>Płatność</h2><button class="close" onclick="closeModal()">✕</button></div><p class="muted">Wybierz metodę. W tej wersji jest to symulacja.</p><div class="paygrid"><button class="payopt" onclick="finishSale('Karta')">💳<br>Karta</button><button class="payopt" onclick="finishSale('Gotówka')">💵<br>Gotówka</button><button class="payopt" onclick="finishSale('BLIK')">📱<br>BLIK</button></div></div>`}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function finishSale(payment){let total=cart.reduce((a,x)=>a+x.price*x.qty,0),sale={id:db.next.sale++,date:new Date().toISOString(),employee:current.name,items:cart.map(x=>({...x})),total,payment};db.sales.push(sale);cart.forEach(x=>{let p=db.products.find(p=>p.id===x.id);if(p)p.stock=Math.max(0,p.stock-x.qty)});persist();cart=[];closeModal();toast('Sprzedaż zapisana offline ✓');sales()}
function orders(){title('Zamówienia','Obsługa zamówień i statusów','<button class="btn primary" onclick="newOrder()">+ Nowe zamówienie</button>');let rows=db.orders.slice().reverse().map(o=>`<tr><td>#${o.id}</td><td>${o.customer||'—'}</td><td>${o.items.length} poz.</td><td>${money(o.total)}</td><td><span class="badge ${o.status==='Zamknięte'?'green':'orange'}">${o.status}</span></td><td><button class="btn small" onclick="orderStatus(${o.id})">Zmień</button></td></tr>`).join('');document.getElementById('content').innerHTML+=`<div class="panel"><table class="table"><tr><th>Nr</th><th>Klient</th><th>Pozycje</th><th>Wartość</th><th>Status</th><th></th></tr>${rows||'<tr><td colspan=6 class="empty">Brak zamówień</td></tr>'}</table></div>`}
function newOrder(){db.orders.push({id:db.next.order++,date:new Date().toISOString(),customer:'Nowe zamówienie',items:[],total:0,status:'Nowe'});persist();orders();toast('Dodano zamówienie')}
function orderStatus(id){let o=db.orders.find(x=>x.id===id),st=['Nowe','W realizacji','Gotowe','Zamknięte'];o.status=st[(st.indexOf(o.status)+1)%st.length];persist();orders()}
function productsPage(){title('Produkty','Katalog, ceny, VAT i dostępność','<button class="btn primary" onclick="productForm()">+ Dodaj produkt</button>');let q=prompt('Opcjonalnie wpisz nazwę do filtrowania lub anuluj','');let ps=db.products.filter(p=>!q||p.name.toLowerCase().includes(q.toLowerCase()));document.getElementById('content').innerHTML+=`<div class="panel"><table class="table"><tr><th>Produkt</th><th>Kategoria</th><th>Cena</th><th>VAT</th><th>Stan</th><th>Status</th><th></th></tr>${ps.map(p=>`<tr><td>${p.emoji} <b>${p.name}</b></td><td>${p.cat}</td><td>${money(p.price)}</td><td>${p.vat}%</td><td>${p.stock}</td><td>${p.active?'<span class="badge green">Aktywny</span>':'<span class="badge">Ukryty</span>'}</td><td><button class="btn small" onclick="productForm(${p.id})">Edytuj</button> <button class="btn small danger" onclick="toggleProduct(${p.id})">${p.active?'Ukryj':'Włącz'}</button></td></tr>`).join('')}</table></div>`}
function productForm(id){let p=id?db.products.find(x=>x.id===id):{name:'',price:0,vat:23,stock:0,cat:'Inne',emoji:'📦',active:true};document.getElementById('modal').classList.remove('hidden');document.getElementById('modal').innerHTML=`<div class="modalbox"><div class="modalhead"><h2>${id?'Edytuj produkt':'Nowy produkt'}</h2><button class="close" onclick="closeModal()">✕</button></div><div class="formgrid"><div class="field"><label>Nazwa</label><input id="f_name" value="${p.name}"></div><div class="field"><label>Cena brutto</label><input id="f_price" type="number" step=".01" value="${p.price}"></div><div class="field"><label>Kategoria</label><input id="f_cat" value="${p.cat}"></div><div class="field"><label>VAT %</label><input id="f_vat" type="number" value="${p.vat}"></div><div class="field"><label>Stan magazynowy</label><input id="f_stock" type="number" value="${p.stock}"></div><div class="field"><label>Emoji</label><input id="f_emoji" value="${p.emoji}"></div></div><br><button class="btn primary" onclick="saveProduct(${id||0})">Zapisz</button></div>`}
function saveProduct(id){let p=id?db.products.find(x=>x.id===id):{id:db.next.product++,active:true};Object.assign(p,{name:f_name.value,price:+f_price.value,cat:f_cat.value,vat:+f_vat.value,stock:+f_stock.value,emoji:f_emoji.value});if(!id)db.products.push(p);persist();closeModal();productsPage()}
function toggleProduct(id){let p=db.products.find(x=>x.id===id);p.active=!p.active;persist();productsPage()}
function inventory(){title('Magazyn','Stany, przyjęcia i korekty','<button class="btn primary" onclick="stockForm()">+ Przyjęcie / korekta</button>');document.getElementById('content').innerHTML+=`<div class="cards">${db.products.filter(p=>p.active).slice(0,4).map(p=>`<div class="stat"><div class="label">${p.emoji} ${p.name}</div><div class="value">${p.stock} szt.</div><div class="hint">${p.stock<=5?'Niski stan':'Stan OK'}</div></div>`).join('')}</div><div class="panel"><table class="table"><tr><th>Produkt</th><th>Stan</th><th>Wartość</th><th>Status</th></tr>${db.products.filter(p=>p.active).map(p=>`<tr><td>${p.name}</td><td>${p.stock}</td><td>${money(p.stock*p.price)}</td><td>${p.stock<=5?'<span class="badge red">Uzupełnij</span>':'<span class="badge green">OK</span>'}</td></tr>`).join('')}</table></div>`}
function stockForm(){document.getElementById('modal').classList.remove('hidden');document.getElementById('modal').innerHTML=`<div class="modalbox"><div class="modalhead"><h2>Ruch magazynowy</h2><button class="close" onclick="closeModal()">✕</button></div><div class="formgrid"><div class="field full"><label>Produkt</label><select id="s_prod">${db.products.map(p=>`<option value="${p.id}">${p.name}</option>`)}</select></div><div class="field"><label>Ilość (+ przyjęcie, − korekta)</label><input id="s_qty" type="number" value="1"></div></div><br><button class="btn primary" onclick="saveStock()">Zapisz ruch</button></div>`}
function saveStock(){let p=db.products.find(x=>x.id==s_prod.value);p.stock=Math.max(0,p.stock+ +s_qty.value);db.stockMoves.push({id:db.next.stock,product:p.name,qty:+s_qty.value,date:new Date().toISOString(),employee:current.name});db.next.stock++;persist();closeModal();inventory();toast('Magazyn zaktualizowany')}
function tables(){title('Stoliki','Obsługa sali i statusów','<button class="btn" onclick="resetTables()">Resetuj stoliki</button>');document.getElementById('content').innerHTML+=`<div class="grid4">${db.tables.map(t=>`<button class="panel" style="padding:22px;text-align:left" onclick="tableAction(${t.id})"><div style="font-size:28px">🪑</div><b>Stolik ${t.id}</b><div class="muted">${t.status}</div></button>`).join('')}</div>`}
function tableAction(id){let t=db.tables.find(x=>x.id===id);t.status=t.status==='Wolny'?'Zajęty':t.status==='Zajęty'?'Do rachunku':'Wolny';persist();tables()}
function resetTables(){db.tables.forEach(t=>t.status='Wolny');persist();tables()}
function customers(){title('Klienci','Baza klientów i historia zakupów','<button class="btn primary" onclick="customerForm()">+ Dodaj klienta</button>');document.getElementById('content').innerHTML+=`<div class="panel"><table class="table"><tr><th>Klient</th><th>Telefon</th><th>E-mail</th><th></th></tr>${db.customers.map(c=>`<tr><td><b>${c.name}</b></td><td>${c.phone||'—'}</td><td>${c.email||'—'}</td><td><button class="btn small danger" onclick="delCustomer(${c.id})">Usuń</button></td></tr>`).join('')||'<tr><td colspan=4 class="empty">Brak klientów</td></tr>'}</table></div>`}
function customerForm(){document.getElementById('modal').classList.remove('hidden');document.getElementById('modal').innerHTML=`<div class="modalbox"><div class="modalhead"><h2>Nowy klient</h2><button class="close" onclick="closeModal()">✕</button></div><div class="formgrid"><div class="field"><label>Imię i nazwisko</label><input id="c_name"></div><div class="field"><label>Telefon</label><input id="c_phone"></div><div class="field"><label>E-mail</label><input id="c_email"></div></div><br><button class="btn primary" onclick="saveCustomer()">Zapisz</button></div>`}
function saveCustomer(){db.customers.push({id:db.next.customer++,name:c_name.value,phone:c_phone.value,email:c_email.value});persist();closeModal();customers()}
function delCustomer(id){db.customers=db.customers.filter(x=>x.id!==id);persist();customers()}
function expenses(){title('Wydatki','Koszty operacyjne lokalu','<button class="btn primary" onclick="expenseForm()">+ Dodaj wydatek</button>');let total=db.expenses.reduce((a,x)=>a+x.amount,0);document.getElementById('content').innerHTML+=`<div class="cards"><div class="stat"><div class="label">Wydatki łącznie</div><div class="value">${money(total)}</div></div></div><div class="panel"><table class="table"><tr><th>Data</th><th>Kategoria</th><th>Opis</th><th>Kwota</th></tr>${db.expenses.slice().reverse().map(e=>`<tr><td>${new Date(e.date).toLocaleDateString('pl-PL')}</td><td>${e.cat}</td><td>${e.desc}</td><td>${money(e.amount)}</td></tr>`).join('')||'<tr><td colspan=4 class="empty">Brak wydatków</td></tr>'}</table></div>`}
function expenseForm(){document.getElementById('modal').classList.remove('hidden');document.getElementById('modal').innerHTML=`<div class="modalbox"><div class="modalhead"><h2>Wydatek</h2><button class="close" onclick="closeModal()">✕</button></div><div class="formgrid"><div class="field"><label>Kwota</label><input id="e_amount" type="number" step=".01"></div><div class="field"><label>Kategoria</label><select id="e_cat"><option>Zakupy</option><option>Czynsz</option><option>Media</option><option>Wynagrodzenia</option><option>Inne</option></select></div><div class="field full"><label>Opis</label><input id="e_desc"></div></div><br><button class="btn primary" onclick="saveExpense()">Zapisz</button></div>`}
function saveExpense(){db.expenses.push({id:db.next.expense++,date:new Date().toISOString(),amount:+e_amount.value,cat:e_cat.value,desc:e_desc.value});persist();closeModal();expenses()}
function reports(){let rev=db.sales.reduce((a,s)=>a+s.total,0),cash=db.sales.filter(s=>s.payment==='Gotówka').reduce((a,s)=>a+s.total,0),card=db.sales.filter(s=>s.payment==='Karta').reduce((a,s)=>a+s.total,0),blik=db.sales.filter(s=>s.payment==='BLIK').reduce((a,s)=>a+s.total,0);let top={};db.sales.flatMap(s=>s.items).forEach(i=>top[i.name]=(top[i.name]||0)+i.qty);let topRows=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,8);title('Raporty','Sprzedaż, płatności i produkty');document.getElementById('content').innerHTML+=`<div class="cards"><div class="stat"><div class="label">Sprzedaż łącznie</div><div class="value">${money(rev)}</div></div><div class="stat"><div class="label">Gotówka</div><div class="value">${money(cash)}</div></div><div class="stat"><div class="label">Karta</div><div class="value">${money(card)}</div></div><div class="stat"><div class="label">BLIK</div><div class="value">${money(blik)}</div></div></div><div class="grid3"><div class="panel"><div class="panelhead"><b>Najczęściej sprzedawane</b></div><div class="panelbody">${topRows.map(x=>`<div class="row"><span>${x[0]}</span><b>${x[1]} szt.</b></div>`).join('')||'<div class="empty">Brak danych</div>'}</div></div><div class="panel"><div class="panelhead"><b>Transakcje</b></div><div class="panelbody"><div class="row"><span>Liczba</span><b>${db.sales.length}</b></div><div class="row"><span>Średni paragon</span><b>${money(db.sales.length?rev/db.sales.length:0)}</b></div></div></div><div class="panel"><div class="panelhead"><b>Eksport</b></div><div class="panelbody"><button class="btn primary" onclick="downloadCSV()">Pobierz CSV sprzedaży</button></div></div></div>`}
function employees(){title('Pracownicy','PIN-y, role i dostęp','<button class="btn primary" onclick="employeeForm()">+ Dodaj pracownika</button>');document.getElementById('content').innerHTML+=`<div class="panel"><table class="table"><tr><th>Pracownik</th><th>Rola</th><th>Status</th><th></th></tr>${db.employees.map(e=>`<tr><td><b>${e.name}</b></td><td>${e.role}</td><td>${e.active?'<span class="badge green">Aktywny</span>':'<span class="badge red">Zablokowany</span>'}</td><td><button class="btn small" onclick="employeeForm(${e.id})">Edytuj</button> <button class="btn small danger" onclick="toggleEmp(${e.id})">${e.active?'Zablokuj':'Włącz'}</button></td></tr>`).join('')}</table></div>`}
function employeeForm(id){let e=id?db.employees.find(x=>x.id===id):{name:'',role:'Kasjer',pin:'',active:true};document.getElementById('modal').classList.remove('hidden');document.getElementById('modal').innerHTML=`<div class="modalbox"><div class="modalhead"><h2>${id?'Edytuj pracownika':'Nowy pracownik'}</h2><button class="close" onclick="closeModal()">✕</button></div><div class="formgrid"><div class="field"><label>Imię i nazwisko</label><input id="u_name" value="${e.name}"></div><div class="field"><label>Rola</label><select id="u_role"><option ${e.role==='Kasjer'?'selected':''}>Kasjer</option><option ${e.role==='Kierownik'?'selected':''}>Kierownik</option><option ${e.role==='Administrator'?'selected':''}>Administrator</option></select></div><div class="field"><label>PIN 4 cyfry</label><input id="u_pin" inputmode="numeric" maxlength="4" value="${e.pin}"></div></div><br><button class="btn primary" onclick="saveEmployee(${id||0})">Zapisz</button></div>`}
function saveEmployee(id){if(!/^\d{4}$/.test(u_pin.value))return toast('PIN musi mieć 4 cyfry');if(db.employees.some(e=>e.pin===u_pin.value&&e.id!==id))return toast('Ten PIN jest już zajęty');let e=id?db.employees.find(x=>x.id===id):{id:db.next.employee++,active:true};Object.assign(e,{name:u_name.value,role:u_role.value,pin:u_pin.value});if(!id)db.employees.push(e);persist();closeModal();employees()}
function toggleEmp(id){if(id===current.id)return toast('Nie możesz zablokować siebie');let e=db.employees.find(x=>x.id===id);e.active=!e.active;persist();employees()}
function settings(){title('Ustawienia','Konfiguracja lokalu');document.getElementById('content').innerHTML+=`<div class="panel"><div class="panelbody"><div class="formgrid"><div class="field"><label>Nazwa trybu działalności</label><select id="set_business"><option>Restauracja</option><option>Kawiarnia</option><option>Sklep</option></select></div><div class="field"><label>Domyślny VAT %</label><input id="set_tax" type="number" value="${db.settings.tax}"></div><div class="field full"><label>Stopka paragonu</label><textarea id="set_footer">${db.settings.receiptFooter}</textarea></div></div><br><button class="btn primary" onclick="saveAllSettings()">Zapisz ustawienia</button></div></div>`;set_business.value=db.settings.business}
function saveAllSettings(){db.settings.business=set_business.value;db.settings.tax=+set_tax.value;db.settings.receiptFooter=set_footer.value;document.getElementById('business').value=db.settings.business;persist();toast('Ustawienia zapisane');}
function backup(){title('Kopia danych','Eksport i import całej lokalnej bazy');document.getElementById('content').innerHTML+=`<div class="grid3"><div class="panel"><div class="panelhead"><b>Eksport</b></div><div class="panelbody"><p class="muted">Zapisz kopię produktów, pracowników, sprzedaży i ustawień.</p><button class="btn primary" onclick="exportJSON()">⬇️ Pobierz kopię JSON</button></div></div><div class="panel"><div class="panelhead"><b>Import</b></div><div class="panelbody"><p class="muted">Wczytaj wcześniej wykonaną kopię.</p><input type="file" accept=".json" onchange="importJSON(event)"></div></div><div class="panel"><div class="panelhead"><b>Stan offline</b></div><div class="panelbody"><span class="badge green">Dane lokalne aktywne</span><p class="muted">Aplikacja nie wymaga internetu do sprzedaży demonstracyjnej.</p></div></div></div>`}
function exportJSON(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='novapos-backup.json';a.click();toast('Kopia pobrana')}
function importJSON(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);persist();toast('Kopia wczytana');go('dashboard')}catch{toast('Nieprawidłowa kopia')}};r.readAsText(f)}
function downloadCSV(){let csv='ID;Data;Pracownik;Płatność;Kwota\\n'+db.sales.map(s=>`${s.id};${s.date};${s.employee};${s.payment};${s.total.toFixed(2)}`).join('\\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='novapos-sprzedaz.csv';a.click()}
let saved=sessionStorage.getItem('novapos-current');if(saved){current=JSON.parse(saved);document.getElementById('login').classList.add('hidden');document.getElementById('who').textContent=current.name+' · '+current.role;document.getElementById('business').value=db.settings.business;renderNav();go('dashboard')}else{document.getElementById('login').classList.remove('hidden')}
persist();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body></html>
